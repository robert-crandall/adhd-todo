          <div class="spotlight-modal">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font-weight:700; font-size:14px; display:inline-flex; align-items:center; gap:6px;">
                ${icon('zap', 15)} Under-10-Second Capture (macOS Cmd+Shift+Space / iPhone Action Button)
              </span>
              <button class="btn btn-sm" onclick="closeModal()">Esc</button>
            </div>
            <input class="input" id="qc-title" placeholder="What's on your mind? (Defaults: Anywhere · Quick)" autofocus />
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
              <select class="input" id="qc-context" style="width:auto;">
                <option value="Anywhere">Anywhere (Default)</option>
                <option value="Outside">Outside / House</option>
                <option value="Computer">Computer</option>
                <option value="Errands">Errands</option>
              </select>
              <select class="input" id="qc-effort" style="width:auto;">
                <option value="Quick">Quick (~5m)</option>
                <option value="Medium">Medium (~20m)</option>
                <option value="Big">Big (1h+)</option>
              </select>
              <button class="btn btn-sm" onclick="simulateVoiceCapture()">${icon('mic', 13)} Dictate Sample</button>
              <button class="btn btn-primary" style="margin-left:auto;" onclick="submitQuickCapture()">Save to Pool</button>
            </div>
          </div>
        </div>
      `;
      setTimeout(() => {
        const inp = document.getElementById('qc-title');
        if (inp) inp.focus();
      }, 20);
    }

    function simulateVoiceCapture() {
      const inp = document.getElementById('qc-title');
      if (inp) inp.value = 'Put salt bags by basement stairs before December snow';
      document.getElementById('qc-context').value = 'Outside';
      document.getElementById('qc-effort').value = 'Quick';
    }

    function submitQuickCapture() {
      const title = (document.getElementById('qc-title')?.value || '').trim();
      if (!title) return;
      const context = document.getElementById('qc-context').value;
      const effort = document.getElementById('qc-effort').value;
      state.tasks.unshift({
        id: `t-${Date.now()}`,
        title,
        notes: 'Captured in <10s via Quick Capture',
        context,
        effort,
        estMinutes: effort === 'Quick' ? 5 : 20,
        status: 'active',
        steps: []
      });
      closeModal();
      logAction(`[Voice/Quick Capture] Captured "${title}" (${context} · ${effort}) into Pool`);
    }

    function openSnoozeModal(taskId) {
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="spotlight-modal">
            <div style="font-weight:700; font-size:15px; display:inline-flex; align-items:center; gap:6px;">
              ${icon('moon', 15)} Snooze "${escapeHtml(t.title)}"
            </div>
            <div style="font-size:12.5px; color:var(--text-secondary);">
              Skipping and snoozing are free. No badge count, no penalty.
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button class="btn btn-primary" onclick="snoozeTask('${t.id}', 'tomorrow')">Tomorrow</button>
              <button class="btn" onclick="snoozeTask('${t.id}', 'next-week')">Next Week (+7d)</button>
              <button class="btn" onclick="snoozeTask('${t.id}', 'next-season')">Next Season (+3mo)</button>
              <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
            </div>
          </div>
        </div>
      `;
    }

    function openTaskModal(taskId) {
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="spotlight-modal">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="chip ${t.effort.toLowerCase()}">${t.effort} · ${t.context}</span>
              <button class="btn btn-sm" onclick="closeModal()">Close</button>
            </div>
            <div style="font-weight:700; font-size:16px;">${escapeHtml(t.title)}</div>
            <div style="font-size:13px; color:var(--text-secondary);">${escapeHtml(t.notes || 'No extra notes.')}</div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button class="btn btn-sm btn-primary" onclick="breakDownTaskAI('${t.id}'); closeModal();">
                ${icon('sparkles', 13)} Copilot SDK: Break Into 3 Steps
              </button>
              <button class="btn btn-sm btn-done" onclick="completeTask('${t.id}'); closeModal();">
                ${icon('check', 13)} Mark Done
              </button>
              <button class="btn btn-sm" onclick="archiveTask('${t.id}'); closeModal();">
                ${icon('leaf', 13)} Let It Go (Archive)
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function closeModal() {
      document.getElementById('modal-root').innerHTML = '';
    }

    function setNav(nav) {
      state.nav = nav;
      renderAll();
    }

    function updatePullFilter(context, effort) {
      if (context) state.pullFilter.context = context;
      if (effort) state.pullFilter.effort = effort;
      state.pullFilter.results = DrawEngine.computePullDraw(state, state.pullFilter.context, state.pullFilter.effort);
      logAction(`[Pull Draw] Filter set to ${state.pullFilter.context} + ${state.pullFilter.effort}`);
    }

    function rerollPull() {
      state.pullFilter.results = DrawEngine.computePullDraw(
        state,
        state.pullFilter.context,
        state.pullFilter.effort,
        state.pullFilter.results
      );
      logAction(`[Pull Draw] Rerolled Pull options (no penalty)`);
    }

    function rerollBothWeekly() {
      const exclude = [state.weeklyDraw.quickId, state.weeklyDraw.mediumId].filter(Boolean);
      state.weeklyDraw = DrawEngine.computeWeeklyDraw(state, exclude);
      logAction(`[Weekly Draw] Rerolled both weekly slots from eligible pool`);
    }

    function toggleHardDay() {
      state.hardDayMode = !state.hardDayMode;
      logAction(state.hardDayMode ? '[Hard Day] Entered Hard Day Mode (1 task, 2-minute timer)' : 'Exited Hard Day Mode');
    }

    function toggleWorkDuty() {
      state.workHoursOn = !state.workHoursOn;
      logAction(state.workHoursOn ? '[Work Stream] Enabled' : '[Off Duty] External work stream hidden');
    }

    function toggleWorkLaneExpanded() {
      state.workLaneExpanded = !state.workLaneExpanded;
      renderAll();
    }

    function toggleMenuBarPopover() {
      state.menuBarOpen = !state.menuBarOpen;
      renderAll();
    }

    function toggleInspector() {
      state.inspectorOpen = !state.inspectorOpen;
      renderAll();
    }

    function toggleAnchor(anchorKey) {
      state.anchors[anchorKey] = !state.anchors[anchorKey];
      state.weeklyDraw = DrawEngine.computeWeeklyDraw(state);
      logAction(`[Anchor] Flipped seasonal anchor "${anchorKey}" to ${state.anchors[anchorKey] ? 'ON' : 'OFF'}`);
    }

    function setPoolContext(c) {
      state.poolFilter.context = c;
      renderAll();
    }

    function forceIntoWeeklyDraw(taskId) {
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      if (t.effort === 'Quick') state.weeklyDraw.quickId = t.id;
      else state.weeklyDraw.mediumId = t.id;
      state.nav = 'home';
      logAction(`Pulled "${t.title}" into This Week's Draw`);
    }

    function clearOverflowNotifications() {
      state.tasks = state.tasks.filter(t => !t.id.startsWith('gh-extra-'));
      logAction(`[Batch Triage] Triaged overflow GitHub notifications in one batch`);
    }

    function runBrainDumpFromInput() {
      const el = document.getElementById('braindump-input');
      if (el) state.brainDumpText = el.value;
      parseBrainDump(state.brainDumpText);
    }

    function testSelfCriticalInput() {
      state.brainDumpText = "I'm failing at everything this week and can't do anything right, the house is a mess.";
      parseBrainDump(state.brainDumpText);
    }

    function activateHardDayFromCrisis() {
      state.hardDayMode = true;
      state.nav = 'home';
      logAction('[Hard Day] Switched to Hard Day mode from gentle language check');
    }

    /* =========================================================================
       MASTER RENDER LOOP & EVENT WIRING
       ========================================================================= */
    function renderAll() {
      // Scenario tabs
      const tabsEl = document.getElementById('scenario-tabs');
      tabsEl.innerHTML = `<span style="font-weight:600; color:var(--text-secondary); margin-right:4px;">Walkthroughs:</span>` +
        SCENARIOS.map(s => `
          <button class="scenario-tab ${activeScenarioId === s.id ? 'active' : ''}" onclick="runScenario('${s.id}')">
            ${escapeHtml(s.label)}
          </button>
        `).join('');

      document.getElementById('last-action-log').textContent = state.lastAction;
      document.getElementById('btn-quick-capture').innerHTML = `${icon('command', 13)} Cmd+K Capture`;
      document.getElementById('btn-toggle-tags').innerHTML = state.hideTags
        ? `${icon('eye', 13)} Tags: Hidden`
        : `${icon('eye-off', 13)} Hide Tags`;
      document.getElementById('btn-mcp-console').innerHTML = `${icon('terminal', 13)} External MCP Push`;
      document.getElementById('btn-hard-day').innerHTML = state.hardDayMode
        ? `${icon('waves', 13)} Exit Hard Day`
        : `${icon('waves', 13)} Hard Day Mode`;
      document.getElementById('btn-work-duty').innerHTML = state.workHoursOn
        ? `${icon('briefcase', 13)} Work Stream: On`
        : `${icon('moon', 13)} Work Stream: Off Duty`;
      document.getElementById('btn-inspector').innerHTML = `${icon('search', 13)} Draw Math`;
      document.getElementById('btn-theme').innerHTML = `${icon('sun', 13)} Theme`;

      // Main stage: macOS + iPhone
      const stageMain = document.getElementById('stage-main');
      let macHtml = '';
      if (currentVariant === 'A') macHtml = renderMacOSVariantA();
      else if (currentVariant === 'B') macHtml = renderMacOSVariantB();
      else macHtml = renderMacOSVariantC();

      const iphoneHtml = renderIPhoneCompanion();

      if (currentDevice === 'macos') {
        stageMain.innerHTML = macHtml;
      } else if (currentDevice === 'iphone') {
        stageMain.innerHTML = iphoneHtml;
      } else {
        stageMain.innerHTML = macHtml + iphoneHtml;
      }

      // Inspector
      const insp = document.getElementById('inspector-panel');
      if (state.inspectorOpen) {
        insp.style.display = 'flex';
        insp.innerHTML = renderInspector();
      } else {
        insp.style.display = 'none';
      }

      // Bottom Floating Switcher
      const vMeta = VARIANTS[currentVariant];
      document.getElementById('variant-label').textContent = `${vMeta.key} (${vMeta.name})`;
      const devLabels = {
        both: `${icon('monitor', 13)} + ${icon('smartphone', 13)} Both`,
        macos: `${icon('monitor', 13)} macOS Only`,
        iphone: `${icon('smartphone', 13)} iPhone Only`
      };
      document.getElementById('device-cycle').innerHTML = devLabels[currentDevice];
    }

    function runScenario(id) {
      activeScenarioId = id;
      const sc = SCENARIOS.find(x => x.id === id);
      if (sc) sc.run();
    }

    // Top bar & Switcher listeners
    document.getElementById('btn-quick-capture').addEventListener('click', openQuickCaptureModal);
    document.getElementById('btn-toggle-tags').addEventListener('click', toggleHideTags);
    document.getElementById('btn-mcp-console').addEventListener('click', () => setNav('mcp'));
    document.getElementById('btn-hard-day').addEventListener('click', toggleHardDay);
    document.getElementById('btn-work-duty').addEventListener('click', toggleWorkDuty);
    document.getElementById('btn-inspector').addEventListener('click', toggleInspector);
    document.getElementById('btn-theme').addEventListener('click', () => {
      const root = document.documentElement;
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
    });

    const variantOrder = ['A', 'B', 'C'];
    document.getElementById('variant-prev').addEventListener('click', () => {
      const next = variantOrder[(variantOrder.indexOf(currentVariant) - 1 + variantOrder.length) % variantOrder.length];
      setVariant(next);
    });
    document.getElementById('variant-next').addEventListener('click', () => {
      const next = variantOrder[(variantOrder.indexOf(currentVariant) + 1) % variantOrder.length];
      setVariant(next);
    });
    document.getElementById('device-cycle').addEventListener('click', cycleDevice);

    window.addEventListener('keydown', (e) => {
      const tag = (e.target && e.target.tagName) || '';
      const isInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.target?.isContentEditable;
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openQuickCaptureModal();
        return;
      }
      if (e.key === 'Escape') {
        closeModal();
        return;
      }
      if (isInput) return;
      if (e.key === 'ArrowLeft') {
        const next = variantOrder[(variantOrder.indexOf(currentVariant) - 1 + variantOrder.length) % variantOrder.length];
        setVariant(next);
      } else if (e.key === 'ArrowRight') {
        const next = variantOrder[(variantOrder.indexOf(currentVariant) + 1) % variantOrder.length];
        setVariant(next);
      }
    });

    // Initial render
    renderAll();
  </script>
</body>
</html>
