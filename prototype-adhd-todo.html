<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROTOTYPE - No-Guilt Task Picker (macOS + iPhone)</title>
  <style>
    :root {
      --bg-canvas: #0b0e14;
      --bg-surface: #131822;
      --bg-elevated: #1c2331;
      --bg-hover: #252e40;
      --bg-glass: rgba(24, 30, 44, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #f0f4f8;
      --text-secondary: #9aa5b8;
      --text-muted: #647087;
      --accent: #7c9cff;
      --accent-soft: rgba(124, 156, 255, 0.14);
      --emerald: #4ade80;
      --emerald-soft: rgba(74, 222, 128, 0.14);
      --amber: #fbbf24;
      --amber-soft: rgba(251, 191, 36, 0.14);
      --purple: #c084fc;
      --purple-soft: rgba(192, 132, 252, 0.14);
      --rose: #f472b6;
      --rose-soft: rgba(244, 114, 182, 0.14);
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.55);
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.25);
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      --font-mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --radius-lg: 16px;
      --radius-md: 11px;
      --radius-sm: 7px;
    }

    [data-theme="light"] {
      --bg-canvas: #eef1f6;
      --bg-surface: #ffffff;
      --bg-elevated: #f5f7fa;
      --bg-hover: #eaeef5;
      --bg-glass: rgba(255, 255, 255, 0.88);
      --border: rgba(15, 23, 42, 0.08);
      --border-strong: rgba(15, 23, 42, 0.15);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent: #4f6ef7;
      --accent-soft: rgba(79, 110, 247, 0.11);
      --emerald: #16a34a;
      --emerald-soft: rgba(22, 163, 74, 0.11);
      --amber: #d97706;
      --amber-soft: rgba(217, 119, 6, 0.12);
      --purple: #9333ea;
      --purple-soft: rgba(147, 51, 234, 0.11);
      --rose: #db2777;
      --rose-soft: rgba(219, 39, 119, 0.11);
      --shadow-lg: 0 20px 50px rgba(15, 23, 42, 0.12);
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-canvas);
      color: var(--text-primary);
      line-height: 1.45;
      padding-bottom: 88px;
      -webkit-font-smoothing: antialiased;
    }

    /* Prototype Header & Scenario Lab */
    .proto-header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .proto-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .proto-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 99px;
      background: var(--purple-soft);
      color: var(--purple);
      border: 1px solid rgba(192, 132, 252, 0.3);
    }
    .proto-question {
      font-size: 13px;
      color: var(--text-secondary);
      max-width: 780px;
    }
    .proto-question strong { color: var(--text-primary); }
    .proto-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Scenario Walkthrough Bar */
    .scenario-bar {
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 12.5px;
    }
    .scenario-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .scenario-tab {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .scenario-tab:hover { background: var(--bg-hover); color: var(--text-primary); }
    .scenario-tab.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }
    .last-action-pill {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--emerald);
      background: var(--emerald-soft);
      padding: 4px 10px;
      border-radius: 6px;
      max-width: 480px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Buttons & Chips */
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      transition: all 0.14s ease;
    }
    .btn:hover { background: var(--bg-hover); }
    .btn-sm { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }
    .btn-primary:hover { filter: brightness(1.08); background: var(--accent); }
    .btn-done {
      background: var(--emerald-soft);
      color: var(--emerald);
      border-color: rgba(74, 222, 128, 0.3);
    }
    .btn-done:hover { background: rgba(74, 222, 128, 0.24); }
    .btn-amber {
      background: var(--amber-soft);
      color: var(--amber);
      border-color: rgba(251, 191, 36, 0.3);
    }
    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--text-secondary);
    }
    .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 500;
      background: var(--bg-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .chip.quick { color: var(--emerald); background: var(--emerald-soft); border-color: transparent; }
    .chip.medium { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
    .chip.big { color: var(--purple); background: var(--purple-soft); border-color: transparent; }
    .chip.onething { color: var(--amber); background: var(--amber-soft); border-color: rgba(251,191,36,0.3); font-weight: 600; }
    .chip.source { color: var(--text-primary); background: var(--bg-hover); font-family: var(--font-mono); font-size: 11px; }
    .chip.selectable { cursor: pointer; padding: 5px 11px; font-size: 12.5px; }
    .chip.selectable.selected {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Stage Container */
    .stage {
      padding: 20px 24px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 28px;
      min-height: calc(100vh - 175px);
    }
    .stage-main {
      flex: 1;
      max-width: 1280px;
      display: flex;
      justify-content: center;
      gap: 28px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    /* ==========================================
       macOS Window Frame & Menu Bar
       ========================================== */
    .macos-shell {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .macos-menubar {
      height: 30px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
      position: relative;
      box-shadow: var(--shadow-sm);
    }
    .menubar-left, .menubar-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .menubar-appname { font-weight: 700; color: var(--text-primary); }
    .menubar-extra-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 5px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      font-size: 11.5px;
      cursor: pointer;
    }
    .menubar-popover {
      position: absolute;
      top: 36px;
      right: 10px;
      width: 310px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      padding: 14px;
      z-index: 60;
    }

    .macos-window {
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 620px;
    }
    .macos-window.variant-b-window {
      grid-template-columns: 1fr;
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
    }
    .macos-sidebar {
      background: var(--bg-elevated);
      border-right: 1px solid var(--border);
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .traffic-lights {
      display: flex;
      gap: 7px;
      padding: 4px 6px 14px;
    }
    .traffic-dot { width: 11px; height: 11px; border-radius: 50%; }
    .traffic-dot.red { background: #ff5f57; }
    .traffic-dot.yellow { background: #febc2e; }
    .traffic-dot.green { background: #28c840; }

    .nav-section-label {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      padding: 10px 8px 4px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 13px;
      color: var(--text-secondary);
      text-align: left;
      margin-bottom: 2px;
    }
    .nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .nav-item.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    .nav-count {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
    }

    .macos-content {
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
      max-height: 700px;
    }

    /* ==========================================
       iPhone Frame
       ========================================== */
    .iphone-shell {
      width: 375px;
      height: 740px;
      background: var(--bg-surface);
      border: 8px solid #222938;
      border-radius: 44px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }
    .iphone-notch {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
    }
    .dynamic-island {
      background: #000;
      color: #fff;
      border-radius: 99px;
      padding: 3px 12px;
      font-size: 10.5px;
      font-family: var(--font-mono);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .iphone-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .iphone-tabbar {
      height: 60px;
      background: var(--bg-elevated);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 4px 6px 8px;
    }
    .iphone-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      gap: 2px;
      color: var(--text-muted);
      border-radius: 8px;
    }
    .iphone-tab.active { color: var(--accent); font-weight: 600; }

    /* ==========================================
       Cards & Domain UI
       ========================================== */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .week-dots {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--bg-elevated);
      padding: 6px 12px;
      border-radius: 99px;
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-secondary);
    }
    .day-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      background: var(--bg-surface);
      color: var(--text-muted);
      border: 1px solid var(--border-strong);
      cursor: pointer;
    }
    .day-dot.active {
      background: var(--emerald-soft);
      color: var(--emerald);
      border-color: var(--emerald);
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .section-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }
    .task-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.15s ease;
    }
    .task-card:hover { border-color: rgba(124, 156, 255, 0.4); }
    .task-card.one-thing-card {
      border-color: rgba(251, 191, 36, 0.5);
      background: linear-gradient(180deg, rgba(251, 191, 36, 0.06), var(--bg-elevated));
    }
    .task-slot-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .task-title {
      font-size: 15.5px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
    }
    .task-title:hover { color: var(--accent); }
    .task-notes {
      font-size: 12.5px;
      color: var(--text-secondary);
    }
    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .task-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    /* Gentle prompt banner (2x skipped or 14d past do-by) */
    .gentle-banner {
      background: var(--purple-soft);
      border: 1px solid rgba(192, 132, 252, 0.35);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .gentle-banner-title {
      color: var(--purple);
      font-weight: 600;
    }

    /* Hard Day Banner / View */
    .hard-day-box {
      background: linear-gradient(145deg, rgba(124, 156, 255, 0.1), rgba(192, 132, 252, 0.08));
      border: 1px solid rgba(124, 156, 255, 0.35);
      border-radius: var(--radius-lg);
      padding: 28px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin: 12px 0;
    }
    .hard-day-title { font-size: 20px; font-weight: 600; }
    .hard-day-sub { font-size: 13.5px; color: var(--text-secondary); max-width: 420px; }

    /* Focus Timer Bar / Panel */
    .timer-banner {
      background: var(--bg-elevated);
      border: 1px solid var(--accent);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .timer-digits {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }

    /* Hours View Blocks */
    .hours-track {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hour-block {
      background: var(--bg-elevated);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Inputs & Forms */
    .input, textarea {
      width: 100%;
      background: var(--bg-canvas);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13.5px;
    }
    .input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* State & Eligibility Inspector Drawer */
    .inspector-panel {
      width: 340px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 740px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .inspector-row {
      font-size: 11.5px;
      padding: 7px 9px;
      border-radius: 6px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .inspector-row.ineligible { opacity: 0.6; }
    .mono { font-family: var(--font-mono); font-size: 11px; }

    /* Modal / Quick Capture Overlay */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 90px;
      z-index: 90;
    }
    .spotlight-modal {
      width: 92%;
      max-width: 540px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Inline SVG (Lucide-style) Icons */
    .lucide {
      display: inline-block;
      vertical-align: -0.18em;
      flex-shrink: 0;
    }
    .nav-item-left {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* Floating Prototype Switcher (UI.md spec) */
    .proto-switcher {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      z-index: 100;
      font-size: 12.5px;
    }
    .proto-switcher button {
      color: #f8fafc;
      padding: 5px 10px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.1);
      font-weight: 600;
      font-size: 12px;
    }
    .proto-switcher button:hover { background: rgba(255, 255, 255, 0.2); }
    .proto-switcher-label {
      padding: 0 6px;
      font-weight: 600;
      white-space: nowrap;
    }
    .proto-switcher-divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <!-- Top Prototype Header -->
  <header class="proto-header">
    <div class="proto-title-wrap">
      <span class="proto-badge">Throwaway Prototype</span>
      <p class="proto-question">
        <strong>Questions explored:</strong>
        (1) Weighted, zero-overdue Weekly Push + Context Pull draw.
        (2) Local MCP server capture from Copilot &amp; Claude + GitHub Copilot SDK AI features (macOS first, iPhone synced via CloudKit).
      </p>
    </div>
    <div class="proto-controls">
      <button class="btn btn-sm" id="btn-quick-capture" title="Shortcut: Cmd+K"></button>
      <button class="btn btn-sm" id="btn-toggle-tags" title="Hide or show metadata tags for a cleaner surface"></button>
      <button class="btn btn-sm" id="btn-mcp-console" title="Test external push from Copilot / Claude / gh CLI"></button>
      <button class="btn btn-sm" id="btn-hard-day"></button>
      <button class="btn btn-sm" id="btn-work-duty"></button>
      <button class="btn btn-sm" id="btn-inspector"></button>

  <script>
    const DrawEngine = (() => {
      const LEAD_DAYS = { Quick: 7, Medium: 14, Big: 30 };

      function parseMMDD(mmdd, year) {
        const [m, d] = mmdd.split('-').map(Number);
        return new Date(year, m - 1, d);
      }

      function isInsideSeason(window, nowDate) {
        if (!window || !window.start || !window.end) return true;
        const m = nowDate.getMonth() + 1;
        const d = nowDate.getDate();
        const cur = m * 100 + d;
        const [sm, sd] = window.start.split('-').map(Number);
        const [em, ed] = window.end.split('-').map(Number);
        const startVal = sm * 100 + sd;
        const endVal = em * 100 + ed;
        if (startVal <= endVal) {
          return cur >= startVal && cur <= endVal;
        }
        // Wraps year end (e.g., 11-01 to 02-28)
        return cur >= startVal || cur <= endVal;
      }

      function daysBetween(dateStrA, dateStrB) {
        const a = new Date(dateStrA + 'T00:00:00');
        const b = new Date(dateStrB + 'T00:00:00');
        return Math.round((b - a) / (1000 * 60 * 60 * 24));
      }

      function evaluateEligibility(task, state) {
        const reasons = [];
        if (task.status !== 'active') reasons.push(`status is ${task.status}`);
        if (task.source && !state.workHoursOn) reasons.push('Off-duty (work stream hidden)');
        if (task.snoozedUntil && daysBetween(state.today, task.snoozedUntil) > 0) {
          reasons.push(`snoozed until ${task.snoozedUntil}`);
        }
        if (task.cooldownUntil && daysBetween(state.today, task.cooldownUntil) > 0) {
          reasons.push(`on repeat cooldown until ${task.cooldownUntil}`);
        }
        const nowObj = new Date(state.today + 'T00:00:00');
        if (task.seasonWindow && !isInsideSeason(task.seasonWindow, nowObj)) {
          reasons.push(`outside season (${task.seasonWindow.start}..${task.seasonWindow.end})`);
        }
        if (task.eventAnchor && !state.anchors[task.eventAnchor]) {
          reasons.push(`waiting for anchor "${task.eventAnchor}"`);
        }

        const daysSinceShown = task.lastShown
          ? Math.max(0, daysBetween(task.lastShown, state.today))
          : 21;
        const weight = +(1 + daysSinceShown / 7).toFixed(2);

        let withinLeadTime = false;
        let daysUntilDoBy = null;
        let gentlePastDuePrompt = false;
        if (task.doByDate) {
          daysUntilDoBy = daysBetween(state.today, task.doByDate);
          const lead = LEAD_DAYS[task.effort] || 7;
          if (daysUntilDoBy <= lead) withinLeadTime = true;
          if (daysUntilDoBy < -14 && !task.pastDueAcked) gentlePastDuePrompt = true;
        }

        return {
          eligible: reasons.length === 0,
          reasons,
          weight,
          daysSinceShown,
          withinLeadTime,
          daysUntilDoBy,
          gentlePastDuePrompt,
          twiceSkippedPrompt: (task.skippedStreak || 0) >= 2 && !task.skipSheetDismissed
        };
      }

      function pickWeightedSlot(candidates, rng = Math.random) {
        if (!candidates.length) return null;
        // 1. Deadline override: tasks within lead time win first (earliest doByDate)
        const urgent = candidates
          .filter(c => c.eval.withinLeadTime)
          .sort((a, b) => a.task.doByDate.localeCompare(b.task.doByDate));
        if (urgent.length > 0) return urgent[0].task.id;

        // 2. Weighted random draw: weight = 1 + (daysSinceLastShown / 7)
        const totalWeight = candidates.reduce((acc, c) => acc + c.eval.weight, 0);
        let roll = rng() * totalWeight;
        for (const c of candidates) {
          roll -= c.eval.weight;
          if (roll <= 0) return c.task.id;
        }
        return candidates[candidates.length - 1].task.id;
      }

      function computeWeeklyDraw(state, excludeIds = []) {
        // Life Pool only (Outside, Errands, Anywhere - excludes Computer/Work pool)
        const lifeTasks = state.tasks
          .filter(t => t.context !== 'Computer' && !t.source && !excludeIds.includes(t.id))
          .map(t => ({ task: t, eval: evaluateEligibility(t, state) }))
          .filter(x => x.eval.eligible);

        const quickPool = lifeTasks.filter(x => x.task.effort === 'Quick');
        const quickId = pickWeightedSlot(quickPool);

        const mediumPool = lifeTasks.filter(x => x.task.effort === 'Medium' && x.task.id !== quickId);
        let mediumId = pickWeightedSlot(mediumPool);

        // Edge case from spec: if fewer eligible tasks than slots, fill empty slot with another size
        if (!mediumId) {
          const fallback = lifeTasks.filter(x => x.task.id !== quickId);
          mediumId = pickWeightedSlot(fallback);
        }

        let seasonalId = null;
        if (state.seasonalThirdSlotOn) {
          const seasonalPool = lifeTasks.filter(
            x => x.task.id !== quickId && x.task.id !== mediumId &&
                 (x.task.effort === 'Big' || x.task.context === 'Outside' || x.task.seasonWindow || x.task.eventAnchor)
          );
          seasonalId = pickWeightedSlot(seasonalPool);
        }

        return { quickId, mediumId, seasonalId };
      }

      function computeWorkDraw(state, excludeIds = []) {
        if (!state.workHoursOn) return { visible: [], overflowCount: 0 };
        const workTasks = state.tasks
          .filter(t => (t.context === 'Computer' || Boolean(t.source)) && !excludeIds.includes(t.id))
          .map(t => ({ task: t, eval: evaluateEligibility(t, state) }))
          .filter(x => x.eval.eligible)
          .sort((a, b) => {
            const da = a.task.doByDate || '9999-99-99';
            const db = b.task.doByDate || '9999-99-99';
            return da.localeCompare(db);
          });

        const capped = workTasks.slice(0, state.dailyIncomingCap);
        const overflowCount = Math.max(0, workTasks.length - state.dailyIncomingCap);
        return {
          visible: capped.slice(0, 3).map(x => x.task),
          overflowCount
        };
      }

      function computePullDraw(state, contextFilter, effortFilter, excludeIds = []) {
        const matches = state.tasks
          .filter(t => !excludeIds.includes(t.id))
          .map(t => ({ task: t, eval: evaluateEligibility(t, state) }))
          .filter(x => {
            if (!x.eval.eligible) return false;
            if (contextFilter !== 'Any' && x.task.context !== contextFilter) return false;
            if (effortFilter !== 'Any' && x.task.effort !== effortFilter) return false;
            return true;
          });

        const chosen = [];
        let pool = [...matches];
        while (chosen.length < 3 && pool.length > 0) {
          const id = pickWeightedSlot(pool);
          chosen.push(id);
          pool = pool.filter(x => x.task.id !== id);
        }
        return chosen;
      }

      return {
        evaluateEligibility,
        computeWeeklyDraw,
        computeWorkDraw,
        computePullDraw,
        daysBetween
      };
    })();
  </script>

  <script>
    let timerInterval = null;

    function logAction(msg) {
      state.lastAction = msg;
      renderAll();
    }

    function setVariant(v) {
      currentVariant = v;
      const url = new URL(window.location.href);
      url.searchParams.set('variant', v);
      window.history.replaceState({}, '', url);
      renderAll();
    }

    function cycleDevice() {
      const order = ['both', 'macos', 'iphone'];
      currentDevice = order[(order.indexOf(currentDevice) + 1) % order.length];
      const url = new URL(window.location.href);
      url.searchParams.set('device', currentDevice);
      window.history.replaceState({}, '', url);
      renderAll();
    }

    function completeTask(taskId, reason = 'Completed') {
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      if (t.repeatCooldownDays) {
        const next = new Date(state.today + 'T00:00:00');
        next.setDate(next.getDate() + t.repeatCooldownDays);
        t.cooldownUntil = next.toISOString().slice(0, 10);
        t.lastShown = state.today;
      } else {
        t.status = 'done';
      }
      t.oneThing = false;
      if (state.timer.activeTaskId === taskId) {
        state.timer.activeTaskId = null;
        state.timer.running = false;
      }
      if (state.expandedTaskId === taskId) {
        state.expandedTaskId = null;
      }
      if (state.weeklyDraw.quickId === taskId || state.weeklyDraw.mediumId === taskId) {
        state.weeklyDraw = DrawEngine.computeWeeklyDraw(state);
      }
      state.pullFilter.results = DrawEngine.computePullDraw(state, state.pullFilter.context, state.pullFilter.effort);
      logAction(`[Done] ${reason}: "${t.title}"`);
    }

    function skipOrRerollSlot(slotKey, taskId) {
      const t = state.tasks.find(x => x.id === taskId);
      if (t) {
        t.lastShown = state.today;
        t.skippedStreak = (t.skippedStreak || 0) + 1;
        // For Computer/Work pool tasks without a fixed weekly slot, snooze until tomorrow on "Not Now"
        if (slotKey === 'work') {
          const base = new Date(state.today + 'T00:00:00');
          base.setDate(base.getDate() + 1);
          t.snoozedUntil = base.toISOString().slice(0, 10);
        }
      }
      if (state.expandedTaskId === taskId) {
        state.expandedTaskId = null;
      }
      if (slotKey === 'quick' || slotKey === 'medium' || slotKey === 'onething') {
        const nextDraw = DrawEngine.computeWeeklyDraw(state, [taskId]);
        if (slotKey === 'quick') state.weeklyDraw.quickId = nextDraw.quickId;
        else if (slotKey === 'medium') state.weeklyDraw.mediumId = nextDraw.mediumId;
        else state.weeklyDraw = nextDraw;
      } else if (slotKey === 'pull') {
        state.pullFilter.results = DrawEngine.computePullDraw(
          state,
          state.pullFilter.context,
          state.pullFilter.effort,
          [...state.pullFilter.results, taskId]
        );
      }

      logAction(`[Not Now] "${t ? t.title : 'task'}" -> returned to pool with updated lastShown (zero guilt)`);
    }

    function toggleExpandTask(taskId) {
      state.expandedTaskId = state.expandedTaskId === taskId ? null : taskId;
      renderAll();
    }

    function setHomeLayout(mode) {
      state.homeLayout = mode;
      logAction(mode === 'list'
        ? '[Home Layout] Switched to List View (title-only default; click a task to expand notes & tools)'
        : '[Home Layout] Switched to Card View (at-a-glance previous notes, Focus Timer & Break it down)');
    }

    function addSelfNote(taskId) {
      const inp = document.getElementById(`self-note-input-${taskId}`);
      const val = (inp?.value || '').trim();
      if (!val) return;
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      if (!t.previousNotes) t.previousNotes = [];
      t.previousNotes.unshift(`Nov 2026: ${val}`);
      logAction(`[Note Saved] Added note for future-you on "${t.title}"`);
    }

    function snoozeTask(taskId, preset) {
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      const base = new Date(state.today + 'T00:00:00');
      if (preset === 'tomorrow') base.setDate(base.getDate() + 1);
      else if (preset === 'next-week') base.setDate(base.getDate() + 7);
      else if (preset === 'next-season') base.setMonth(base.getMonth() + 3);
      t.snoozedUntil = base.toISOString().slice(0, 10);
      t.lastShown = state.today;
      if (state.weeklyDraw.quickId === taskId || state.weeklyDraw.mediumId === taskId) {
        state.weeklyDraw = DrawEngine.computeWeeklyDraw(state, [taskId]);
      }
      state.pullFilter.results = DrawEngine.computePullDraw(state, state.pullFilter.context, state.pullFilter.effort);
      closeModal();
      logAction(`[Snoozed] "${t.title}" until ${t.snoozedUntil} (hidden from draws until then)`);
    }

    function toggleOneThing(taskId) {
      const target = state.tasks.find(x => x.id === taskId);
      if (!target) return;
      const nextVal = !target.oneThing;
      state.tasks.forEach(t => { t.oneThing = false; });
      target.oneThing = nextVal;
      logAction(nextVal ? `[One Thing] Set "${target.title}" as today's One Thing` : `Cleared One Thing flag`);
    }

    function startTimerForTask(taskId, minutesOverride) {
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      const mins = minutesOverride || t.estMinutes || (t.effort === 'Quick' ? 5 : 20);
      state.timer.activeTaskId = taskId;
      state.timer.totalSec = mins * 60;
      state.timer.remainingSec = mins * 60;
      state.timer.running = true;
      ensureTimerInterval();
      logAction(`[Focus Timer] Started ${mins}m focus session for "${t.title}" (stopping early still counts!)`);
    }

    function stopTimerEarly() {
      const t = state.tasks.find(x => x.id === state.timer.activeTaskId);
      const elapsedMin = Math.max(1, Math.round((state.timer.totalSec - state.timer.remainingSec) / 60));
      state.timer.running = false;
      state.timer.activeTaskId = null;
      if (t) {
        if (!t.previousNotes) t.previousNotes = [];
        t.previousNotes.unshift(`Today: Did a ${elapsedMin}m focus session (stopped early, still counts).`);
      }
      logAction(`[Focus Saved] Saved ${elapsedMin}m focus note onto "${t ? t.title : 'task'}" - stopping early always counts!`);
    }

    function ensureTimerInterval() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (state.timer.running && state.timer.remainingSec > 0) {
          state.timer.remainingSec -= 1;
          const digits = document.querySelectorAll('.live-timer-readout');
          digits.forEach(el => { el.textContent = formatSeconds(state.timer.remainingSec); });
        }
      }, 1000);
    }

    function formatSeconds(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function breakDownTaskAI(taskId) {
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      t.steps = [
        `Open/gather just the first thing needed for "${t.title.slice(0, 28)}..." (2m)`,
        `Do one 5-minute pass without worrying about finishing`,
        `Put tools/tabs away or mark done`
      ];
      t.skippedStreak = 0;
      t.skipSheetDismissed = true;
      logAction(`[Copilot SDK · macOS] Broke "${t.title}" into 3 concrete 5-minute starter steps (synced to iPhone)`);
    }

    function archiveTask(taskId) {
      const t = state.tasks.find(x => x.id === taskId);
      if (!t) return;
      t.status = 'archived';
      state.weeklyDraw = DrawEngine.computeWeeklyDraw(state);
      logAction(`[Archived] Let go of "${t.title}" (archived quietly, zero guilt)`);
    }

    function parseBrainDump(text) {
      const lower = text.toLowerCase();
      if (lower.includes('worthless') || lower.includes('hate myself') || lower.includes('failing at everything') || lower.includes('can\'t do anything')) {
        state.gentleCrisisBanner = {
          message: 'Hey - it sounds like today is heavy. You don\'t owe the list anything right now. Want to switch to Hard Day mode (just one 2-minute step) or take a breather?',
          supportNote: 'If you ever need someone in your corner right now: call or text 988 (US/Canada Lifeline).'
        };
      } else {
        state.gentleCrisisBanner = null;
      }

      const chunks = text
        .split(/[,.;\n]+|\band\b/i)
        .map(s => s.trim())
        .filter(s => s.length > 4);

      state.brainDumpProposals = chunks.map((chunk, idx) => {
        const cLower = chunk.toLowerCase();
        let context = 'Anywhere';
        let effort = 'Quick';
        if (cLower.includes('gutter') || cLower.includes('yard') || cLower.includes('garage') || cLower.includes('porch')) {
          context = 'Outside'; effort = 'Medium';
        } else if (cLower.includes('tab') || cLower.includes('mac') || cLower.includes('email') || cLower.includes('pr')) {
          context = 'Computer'; effort = 'Quick';
        } else if (cLower.includes('pharmacy') || cLower.includes('store') || cLower.includes('drop') || cLower.includes('call')) {
          context = 'Errands'; effort = 'Quick';
        }
        const cleanTitle = chunk.replace(/^(need to|i should|have to)\s+/i, '');
        return {
          id: `bd-${Date.now()}-${idx}`,
          title: cleanTitle.charAt(0).toUpperCase() + cleanTitle.slice(1),
          context,
          effort
        };
      });
      logAction(`[Copilot SDK · macOS] Brain Dump extracted ${state.brainDumpProposals.length} candidate tasks with auto-tagged context & effort`);
    }

    function acceptBrainDumpProposal(propId) {
      const idx = state.brainDumpProposals.findIndex(p => p.id === propId);
      if (idx === -1) return;
      const p = state.brainDumpProposals[idx];
      state.tasks.unshift({
        id: `t-${Date.now()}`,
        title: p.title,
        notes: 'Added from GitHub Copilot SDK Brain Dump (macOS)',
        context: p.context,
        effort: p.effort,
        estMinutes: p.effort === 'Quick' ? 5 : 20,
        status: 'active',
        steps: []
      });
      state.brainDumpProposals.splice(idx, 1);
      logAction(`[Added] "${p.title}" (${p.context} · ${p.effort}) to the Pool`);
    }

    function simulateMcpToolCall(agentSource, toolName, customPayload) {
      if (toolName === 'add_task') {
        const title = customPayload?.title || (agentSource === 'Copilot MCP'
          ? 'Follow up on flaky SwiftData migration test in PR #489'
          : 'Send revised architecture notes to design partner');
        const context = customPayload?.context || 'Computer';
        const effort = customPayload?.effort || 'Quick';
        const newTask = {
          id: `mcp-${Date.now()}`,
          title,
          notes: `Pushed via local MCP Server (${agentSource} -> add_task) · Synced to iPhone via CloudKit`,
          context,
          effort,
          estMinutes: effort === 'Quick' ? 5 : 20,
          source: agentSource,
          externalRef: agentSource === 'Copilot MCP' ? 'mcp://copilot/add_task' : 'mcp://claude/add_task',
          doByDate: customPayload?.doByDate || '2026-11-08',
          lastShown: state.today,
          status: 'active',
          steps: []
        };
        state.tasks.unshift(newTask);
        logAction(`[${agentSource}] Executed MCP tool add_task("${title}") -> added to Pool & Incoming lane`);
      } else if (toolName === 'brain_dump') {
        state.nav = 'braindump';
        state.brainDumpText = customPayload?.text || 'Finish release notes for v0.2, check winter tire pressure, and reply to Alex about Thursday.';
        parseBrainDump(state.brainDumpText);
        logAction(`[${agentSource}] Executed MCP tool brain_dump -> routed to GitHub Copilot SDK parser`);
      }
    }
  </script>

      const sounds = ['Brown Noise', 'White Noise', 'Soft Rain', 'Lo-Fi Beats', 'Off'];
      const next = sounds[(sounds.indexOf(state.timer.sound) + 1) % sounds.length];
      state.timer.sound = next;
      logAction(`[Audio] Switched focus ambient sound to ${next}`);

    function renderTaskListRow(task, slotLabel, slotKey) {
      if (!task) return '';
      const isExpanded = state.expandedTaskId === task.id;
      const ev = DrawEngine.evaluateEligibility(task, state);
      const noteCount = (task.previousNotes ? task.previousNotes.length : 0) + (task.notes ? 1 : 0);

      return `
        <div class="task-card ${task.oneThing ? 'one-thing-card' : ''}" style="padding:11px 14px; gap:10px;">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
            <div style="display:flex; align-items:center; gap:9px; flex:1; cursor:pointer;" onclick="toggleExpandTask('${task.id}')">
              <span style="color:var(--text-muted); display:inline-flex;">
                ${isExpanded ? icon('chevron-down', 15) : icon('chevron-right', 15)}
              </span>
              <div style="display:flex; flex-direction:column; gap:2px;">
                <div style="font-weight:600; font-size:15px; color:var(--text-primary); display:flex; align-items:center; gap:7px; flex-wrap:wrap;">
                  ${task.oneThing ? `<span style="color:var(--accent); display:inline-flex;" title="Today's One Thing">${icon('flame', 14)}</span>` : ''}
                  <span>${escapeHtml(task.title)}</span>
                  ${(!state.hideTags && noteCount > 0 && !isExpanded) ? `
                    <span style="font-size:11px; font-weight:500; color:var(--text-muted); display:inline-flex; align-items:center; gap:3px;">
                      ${icon('file-text', 11)} ${noteCount} ${noteCount === 1 ? 'note' : 'notes'}
                    </span>
                  ` : ''}
                </div>
              </div>
            </div>

            <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
              <button class="btn btn-sm btn-done" onclick="completeTask('${task.id}')">
                ${icon('check', 13)} Done
              </button>
              <button class="btn btn-sm" onclick="skipOrRerollSlot('${slotKey}', '${task.id}')" title="Swap or defer without guilt">
                ${icon('rotate-ccw', 13)} Not Now
              </button>
            </div>
          </div>

          ${isExpanded ? `
            <div style="padding-top:10px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:10px;">
              ${!state.hideTags ? `
                <div class="task-meta">
                  <span class="chip">${slotLabel}</span>
                  <span class="chip ${task.effort.toLowerCase()}">${escapeHtml(task.effort)} · ${task.estMinutes || 10}m</span>
                  <span class="chip">${escapeHtml(task.context)}</span>
                  ${task.source ? `<span class="chip source">${icon(task.source.includes('MCP') ? 'terminal' : task.source === 'GitHub' ? 'git-pull-request' : 'mail', 11)} ${escapeHtml(task.source)}</span>` : ''}
                  ${task.seasonWindow ? `<span class="chip">${icon('leaf', 11)} Season ${task.seasonWindow.start}->${task.seasonWindow.end}</span>` : ''}
                  ${task.eventAnchor ? `<span class="chip">${icon('anchor', 11)} ${escapeHtml(task.eventAnchor)}</span>` : ''}
                  ${task.doByDate ? `<span class="chip">Target ${escapeHtml(task.doByDate)}</span>` : ''}
                </div>
              ` : ''}

              ${renderPreviousNotesSection(task)}

              ${task.steps && task.steps.length > 0 ? `
                <div style="background:var(--bg-canvas); padding:8px 10px; border-radius:6px; font-size:12px; color:var(--text-secondary);">
                  <div style="font-weight:600; color:var(--text-primary); margin-bottom:4px; display:flex; align-items:center; gap:5px;">
                    ${icon('sparkles', 12)} Copilot SDK Steps (${task.steps.length}):
                  </div>
                  ${task.steps.map(s => `<div>• ${escapeHtml(s)}</div>`).join('')}
                </div>
              ` : ''}

              ${ev.twiceSkippedPrompt ? `
                <div class="gentle-banner">
                  <div class="gentle-banner-title">Passed over twice - want a lighter way in?</div>
                  <div style="display:flex; gap:6px; flex-wrap:wrap;">
                    <button class="btn btn-sm btn-primary" onclick="startTimerForTask('${task.id}', 5)">Just 5 mins</button>
                    <button class="btn btn-sm" onclick="breakDownTaskAI('${task.id}')">${icon('sparkles', 12)} Break it down</button>
                    <button class="btn btn-sm" onclick="snoozeTask('${task.id}', 'next-week')">Next week</button>
                    <button class="btn btn-sm" onclick="archiveTask('${task.id}')">Let it go</button>
                  </div>
                </div>
              ` : ''}

              ${ev.gentlePastDuePrompt ? `
                <div class="gentle-banner">
                  <div class="gentle-banner-title">Do-by date was 2+ weeks ago (never overdue). Still want this?</div>
                  <div style="display:flex; gap:6px; flex-wrap:wrap;">
                    <button class="btn btn-sm" onclick="ackPastDue('${task.id}')">Keep in pool</button>
                    <button class="btn btn-sm" onclick="snoozeTask('${task.id}', 'next-week')">Move date +1w</button>
                    <button class="btn btn-sm" onclick="archiveTask('${task.id}')">Let it go</button>
                  </div>
                </div>
              ` : ''}

              <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
                <div style="display:flex; gap:6px; flex-wrap:wrap;">
                  <button class="btn btn-sm btn-primary" onclick="startTimerForTask('${task.id}')">
                    ${icon('timer', 13)} Focus Timer (${task.estMinutes || 10}m)
                  </button>
                  <button class="btn btn-sm" onclick="breakDownTaskAI('${task.id}')">
                    ${icon('sparkles', 13)} Break it down
                  </button>
                  <button class="btn btn-sm" onclick="openSnoozeModal('${task.id}')">
                    ${icon('moon', 13)} Snooze...
                  </button>
                </div>
                <button class="btn btn-sm btn-ghost" onclick="toggleOneThing('${task.id}')">
                  ${task.oneThing ? `${icon('flame', 13)} One Thing` : `${icon('star', 13)} Make One Thing`}
                </button>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderTaskCard(task, slotLabel, slotKey) {
      if (!task) {
        return `
          <div class="task-card">
            <div class="task-slot-label">${ slotLabel }</div>
            <div style="color:var(--text-muted); font-size:13px; padding:12px 0;">
              No matching task in pool for this slot right now.
            </div>
          </div>
        `;
      }
      const ev = DrawEngine.evaluateEligibility(task, state);

      return `
        <div class="task-card ${task.oneThing ? 'one-thing-card' : ''}">
          <div>
            <div class="task-slot-label">
              <span style="display:inline-flex; align-items:center; gap:5px;">${slotLabel}</span>
              <button class="btn-ghost" style="font-size:11.5px; padding:2px 6px; border-radius:4px; display:inline-flex; align-items:center; gap:4px;" onclick="toggleOneThing('${task.id}')" title="Mark as today's One Thing">
                ${task.oneThing ? `${icon('flame', 13)} One Thing` : `${icon('star', 13)} Make One Thing`}
              </button>
            </div>
            <div class="task-title" style="margin-top:6px;" onclick="openTaskModal('${task.id}')">
              ${escapeHtml(task.title)}
            </div>
          </div>

          ${!state.hideTags ? `
            <div class="task-meta">
              <span class="chip ${task.effort.toLowerCase()}">${escapeHtml(task.effort)} · ${task.estMinutes || 10}m</span>
              <span class="chip">${escapeHtml(task.context)}</span>
              ${task.source ? `<span class="chip source">${icon(task.source.includes('MCP') ? 'terminal' : task.source === 'GitHub' ? 'git-pull-request' : 'mail', 11)} ${escapeHtml(task.source)}</span>` : ''}
              ${task.seasonWindow ? `<span class="chip">${icon('leaf', 11)} Season ${task.seasonWindow.start}->${task.seasonWindow.end}</span>` : ''}
              ${task.eventAnchor ? `<span class="chip">${icon('anchor', 11)} ${escapeHtml(task.eventAnchor)}</span>` : ''}
              ${task.doByDate ? `<span class="chip">Target ${escapeHtml(task.doByDate)}</span>` : ''}
            </div>
          ` : ''}

          ${renderPreviousNotesSection(task)}

          ${task.steps && task.steps.length > 0 ? `
            <div style="background:var(--bg-canvas); padding:8px 10px; border-radius:6px; font-size:12px; color:var(--text-secondary);">
              <div style="font-weight:600; color:var(--text-primary); margin-bottom:4px; display:flex; align-items:center; gap:5px;">
                ${icon('sparkles', 12)} Copilot SDK Steps (${task.steps.length}):
              </div>
              ${task.steps.map(s => `<div>• ${escapeHtml(s)}</div>`).join('')}
            </div>
          ` : ''}

          ${ev.twiceSkippedPrompt ? `
            <div class="gentle-banner">
              <div class="gentle-banner-title">Passed over twice - want a lighter way in?</div>
              <div style="display:flex; gap:6px; flex-wrap:wrap;">
                <button class="btn btn-sm btn-primary" onclick="startTimerForTask('${task.id}', 5)">Just 5 mins</button>
                <button class="btn btn-sm" onclick="breakDownTaskAI('${task.id}')">${icon('sparkles', 12)} Break it down</button>
                <button class="btn btn-sm" onclick="snoozeTask('${task.id}', 'next-week')">Next week</button>
                <button class="btn btn-sm" onclick="archiveTask('${task.id}')">Let it go</button>
              </div>
            </div>
          ` : ''}

          ${ev.gentlePastDuePrompt ? `
            <div class="gentle-banner">
              <div class="gentle-banner-title">Do-by date was 2+ weeks ago (never overdue). Still want this?</div>
              <div style="display:flex; gap:6px; flex-wrap:wrap;">
                <button class="btn btn-sm" onclick="ackPastDue('${task.id}')">Keep in pool</button>
                <button class="btn btn-sm" onclick="snoozeTask('${task.id}', 'next-week')">Move date +1w</button>
                <button class="btn btn-sm" onclick="archiveTask('${task.id}')">Let it go</button>
              </div>
            </div>
          ` : ''}

          <div class="task-actions" style="justify-content:space-between;">
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              <button class="btn btn-sm btn-done" onclick="completeTask('${task.id}')">
                ${icon('check', 13)} Done
              </button>
              <button class="btn btn-sm" onclick="skipOrRerollSlot('${slotKey}', '${task.id}')">
                ${icon('rotate-ccw', 13)} Not Now
              </button>
            </div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              <button class="btn btn-sm" onclick="startTimerForTask('${task.id}')">${icon('timer', 13)} Focus Timer</button>
              <button class="btn btn-sm" onclick="breakDownTaskAI('${task.id}')">${icon('sparkles', 13)} Break it down</button>
            </div>
          </div>
        </div>
      `;
    }

    function ackPastDue(taskId) {
      const t = state.tasks.find(x => x.id === taskId);
      if (t) t.pastDueAcked = true;
      logAction(`Kept "${t.title}" in pool at top priority without nagging again`);
    }

    function renderDrawnItems(items) {
      if (state.homeLayout === 'list') {
        return `
          <div style="display:flex; flex-direction:column; gap:8px;">
            ${items.map(it => renderTaskListRow(it.task, it.label, it.key)).join('')}
          </div>
        `;
      }
      return `
        <div class="card-grid">
          ${items.map(it => renderTaskCard(it.task, it.label, it.key)).join('')}
        </div>
      `;
    }

    /* =========================================================================
       SUB-VIEWS (Pull, Pool, Brain Dump, MCP, Hours, Habits, Review)
       ========================================================================= */
    function renderMainContentView(compact = false) {
      if (state.hardDayMode) {
        const easyTask = state.tasks.find(t => t.id === state.timer.activeTaskId)
          || state.tasks.find(t => t.status === 'active' && t.effort === 'Quick')
          || state.tasks[0];
        return `
          <div class="hard-day-box">
            <span class="chip onething">${icon('waves', 12)} Hard Day Mode · Safety Net</span>
            <div class="hard-day-title">One tiny thing. Two minutes. Stopping early counts.</div>
            <div class="hard-day-sub">
              Everything else is hidden and safe. Nothing is overdue.
            </div>
            ${easyTask ? `
              <div class="task-card" style="max-width:420px; width:100%; text-align:left;">
                <div class="task-slot-label">2-Minute Gentle Starter</div>
                <div class="task-title">${escapeHtml(easyTask.title)}</div>
                <div class="task-actions">
                  <button class="btn btn-sm btn-done" onclick="completeTask('${easyTask.id}')">${icon('check', 13)} Did 2 mins (Done!)</button>
                  <button class="btn btn-sm" onclick="startTimerForTask('${easyTask.id}', 2)">${icon('timer', 13)} 2m Timer</button>
                  <button class="btn btn-sm" onclick="skipOrRerollSlot('quick', '${easyTask.id}')">${icon('rotate-ccw', 13)} Pick Even Smaller</button>
                </div>
              </div>
            ` : ''}
            <button class="btn btn-sm" onclick="toggleHardDay()">Exit Hard Day Mode</button>
          </div>
        `;
      }

      if (state.nav === 'work') return renderWorkView(compact);
      if (state.nav === 'pull') return renderPullView();
      if (state.nav === 'pool') return renderPoolView();
      if (state.nav === 'braindump') return renderBrainDumpView(compact);
      if (state.nav === 'mcp') return renderMcpView(compact);
      return renderHomeView(compact);
    }

    function renderHomeView(compact = false) {
      const quickTask = state.tasks.find(t => t.id === state.weeklyDraw.quickId && t.status === 'active');
      const mediumTask = state.tasks.find(t => t.id === state.weeklyDraw.mediumId && t.status === 'active');
      const oneThingTask = state.tasks.find(
        t => t.oneThing && t.status === 'active' && t.context !== 'Computer' && !t.source &&
             t.id !== state.weeklyDraw.quickId && t.id !== state.weeklyDraw.mediumId
      );

      const items = [
        oneThingTask ? { task: oneThingTask, label: `${icon('flame', 13)} Today's One Thing`, key: 'onething' } : null,
        quickTask ? { task: quickTask, label: `${icon('zap', 13)} Quick Slot (~5m)`, key: 'quick' } : null,
        mediumTask ? { task: mediumTask, label: `${icon('wrench', 13)} Medium Slot (~20m)`, key: 'medium' } : null
      ].filter(Boolean);

      return `
        ${renderActiveTimerBanner()}

        <div class="top-bar">
          <div>
            <h2 style="font-size:19px; font-weight:700;">This Week's Draw · Life Pool</h2>
            <p class="section-subtitle">
              ${state.homeLayout === 'list'
                ? 'Title-only by default. Click a task to expand previous notes, Focus Timer & Break it down.'
                : 'Card View: showing previous notes from yourself, Focus Timer & Break it down at a glance.'}
            </p>
          </div>
          ${renderWeekDots()}
        </div>

        ${renderDrawnItems(items)}

        <div style="display:flex; align-items:center; justify-content:space-between; background:var(--bg-elevated); padding:10px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); flex-wrap:wrap; gap:8px;">
          <span style="font-size:12.5px; color:var(--text-secondary);">
            Want a different pair or sitting at your Mac for work?
          </span>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-sm" onclick="rerollBothWeekly()">${icon('rotate-ccw', 13)} Reroll Life Pair</button>
            <button class="btn btn-sm" onclick="setNav('pull')">${icon('dices', 13)} I Have Time (Pull)</button>
            <button class="btn btn-sm btn-primary" onclick="setNav('work')">${icon('monitor', 13)} Switch to Computer / Work Pool</button>
          </div>
        </div>
      `;
    }

    function renderWorkView(compact = false) {
      const workDraw = DrawEngine.computeWorkDraw(state);
      const items = workDraw.visible.map((t, i) => ({
        task: t,
        label: t.source
          ? `${icon(t.source.includes('MCP') ? 'terminal' : t.source === 'GitHub' ? 'git-pull-request' : 'mail', 13)} ${escapeHtml(t.source)} · ${escapeHtml(t.externalRef || 'Pushed')}`
          : `${icon('monitor', 13)} Computer Task #${i + 1}`,
        key: 'work'
      }));

      return `
        ${renderActiveTimerBanner()}

        <div class="top-bar">
          <div>
            <h2 style="font-size:19px; font-weight:700;">Computer / Weekday Work Pool</h2>
            <p class="section-subtitle">
              Separate from Life. Holds Computer tasks + externally pushed GitHub, Gmail, Copilot &amp; Claude items (max 3 shown).
            </p>
          </div>
          ${renderWeekDots()}
        </div>

        ${!state.workHoursOn ? `
          <div class="task-card" style="text-align:center; padding:26px;">
            <div class="task-title">Off Duty - Computer &amp; Work Pool is Tucked Away</div>
            <div class="task-notes" style="margin-top:4px;">Your Life Draw stays completely separate. Turn Work Stream back on whenever you're at your desk.</div>
            <div style="margin-top:10px;">
              <button class="btn btn-sm btn-primary" onclick="toggleWorkDuty()">${icon('sun', 13)} Go On Duty</button>
            </div>
          </div>
        ` : `
          ${renderDrawnItems(items)}
          ${workDraw.overflowCount > 0 ? `
            <div class="task-card" style="border-style:dashed;">
              <div class="task-slot-label">Volume Cap Protection (&gt;${state.dailyIncomingCap}/day)</div>
              <div class="task-title">Triage ${workDraw.overflowCount} additional pushed notifications</div>
              <div class="task-notes">Bundled automatically so external pushes never flood your Computer pool.</div>
              <div class="task-actions">
                <button class="btn btn-sm btn-done" onclick="clearOverflowNotifications()">${icon('check', 13)} Triage All (${workDraw.overflowCount})</button>
              </div>
            </div>
          ` : ''}
        `}

        <div style="display:flex; align-items:center; justify-content:space-between; background:var(--bg-elevated); padding:10px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); flex-wrap:wrap; gap:8px;">
          <span style="font-size:12.5px; color:var(--text-secondary);">
            GitHub &amp; Gmail items are pushed externally via MCP / CLI rather than polled inside the app.
          </span>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-sm" onclick="setNav('mcp')">${icon('terminal', 13)} Simulate External Push</button>
            <button class="btn btn-sm" onclick="toggleWorkDuty()">
              ${state.workHoursOn ? `${icon('moon', 13)} Off Duty` : `${icon('sun', 13)} On Duty`}
            </button>
          </div>
        </div>
      `;
    }

    function renderPullView() {
      const contexts = ['Any', 'Outside', 'Errands', 'Anywhere', 'Computer'];
      const efforts = ['Any', 'Quick', 'Medium', 'Big'];
      const tasks = state.pullFilter.results
        .map(id => state.tasks.find(t => t.id === id))
        .filter(Boolean);
      const items = tasks.map((t, idx) => ({
        task: t,
        label: `Pull Option ${idx + 1} (${t.context})`,
        key: 'pull'
      }));

      return `
        ${renderActiveTimerBanner()}
        <div class="top-bar">
          <div>
            <h2 style="font-size:19px; font-weight:700;">I Have Time (On-Demand Pull Draw)</h2>
            <p class="section-subtitle">Pick your context and energy/time. At most 3 options. Reroll freely.</p>
          </div>
          ${renderWeekDots()}
        </div>

        <div style="display:flex; flex-direction:column; gap:10px; background:var(--bg-elevated); padding:14px; border-radius:var(--radius-md); border:1px solid var(--border);">
          <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <span style="font-size:12px; font-weight:600; width:70px; color:var(--text-secondary);">Pool:</span>
            ${contexts.map(c => `
              <span class="chip selectable ${state.pullFilter.context === c ? 'selected' : ''}" onclick="updatePullFilter('${c}', null)">
                ${c === 'Computer' ? 'Computer / Work' : c}
              </span>
            `).join('')}
          </div>
          <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <span style="font-size:12px; font-weight:600; width:70px; color:var(--text-secondary);">Time:</span>
            ${efforts.map(e => `
              <span class="chip selectable ${state.pullFilter.effort === e ? 'selected' : ''}" onclick="updatePullFilter(null, '${e}')">
                ${e === 'Quick' ? 'Quick (~5m)' : e === 'Medium' ? 'Medium (~20m)' : e === 'Big' ? 'Big (1h+)' : 'Any Time'}
              </span>
            `).join('')}
            <button class="btn btn-sm btn-primary" style="margin-left:auto;" onclick="rerollPull()">${icon('dices', 13)} Reroll Set</button>
          </div>
        </div>

        ${items.length > 0 ? renderDrawnItems(items) : `
          <div class="task-card" style="text-align:center; padding:28px;">
            <div class="task-title">Nothing in the pool matches (${state.pullFilter.context} · ${state.pullFilter.effort}) right now</div>
            <div class="task-notes">Want to widen the filter to Any Context + Any Time?</div>
            <div style="margin-top:10px;">
              <button class="btn btn-sm btn-primary" onclick="updatePullFilter('Any', 'Any')">Widen Filter</button>
            </div>
          </div>
        `}
      `;
    }

    function renderPoolView() {
      const activePoolTab = state.poolFilter.pool || 'life';
      const filtered = state.tasks.filter(t => {
        const isWork = t.context === 'Computer' || Boolean(t.source);
        if (activePoolTab === 'life' && isWork) return false;
        if (activePoolTab === 'work' && !isWork) return false;
        if (state.poolFilter.context !== 'All' && t.context !== state.poolFilter.context) return false;
        return true;
      });

      const lifeCount = state.tasks.filter(t => t.context !== 'Computer' && !t.source && t.status === 'active').length;
      const workCount = state.tasks.filter(t => (t.context === 'Computer' || Boolean(t.source)) && t.status === 'active').length;

      return `
        <div class="top-bar">
          <div>
            <h2 style="font-size:19px; font-weight:700;">Two Separate Pools: Life vs. Computer / Work</h2>
            <p class="section-subtitle">Out-of-season &amp; snoozed tasks stay hidden from Home draws until eligible.</p>
          </div>
          <button class="btn btn-sm btn-primary" onclick="openQuickCaptureModal()">${icon('plus', 13)} Add Task (Cmd+K)</button>
        </div>

        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between;">
          <div style="display:inline-flex; background:var(--bg-elevated); padding:3px; border-radius:8px; border:1px solid var(--border);">
            <button class="btn btn-sm ${activePoolTab === 'life' ? 'btn-primary' : 'btn-ghost'}" style="border:none;" onclick="setPoolTab('life')">
              ${icon('home', 13)} Life Pool (${lifeCount} active · Outside, Errands, Anywhere)
            </button>
            <button class="btn btn-sm ${activePoolTab === 'work' ? 'btn-primary' : 'btn-ghost'}" style="border:none;" onclick="setPoolTab('work')">
              ${icon('monitor', 13)} Computer / Work Pool (${workCount} active · GitHub, Gmail, MCP)
            </button>
          </div>
        </div>

        ${activePoolTab === 'life' ? `
          <div style="display:flex; align-items:center; justify-content:space-between; background:var(--bg-elevated); padding:10px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); flex-wrap:wrap; gap:10px;">
            <span style="font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px;">
              ${icon('anchor', 14)} Seasonal Event Anchors:
            </span>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              ${Object.keys(state.anchors).map(a => `
                <button class="btn btn-sm ${state.anchors[a] ? 'btn-done' : ''}" onclick="toggleAnchor('${a}')">
                  ${state.anchors[a] ? `${icon('check', 12)} Active:` : 'Off:'} ${a}
                </button>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <div style="display:flex; flex-direction:column; gap:8px;">
          ${filtered.map(t => {
            const ev = DrawEngine.evaluateEligibility(t, state);
            const noteCount = (t.previousNotes ? t.previousNotes.length : 0) + (t.notes ? 1 : 0);
            return `
              <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--bg-elevated); padding:10px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); opacity:${ev.eligible ? '1' : '0.58'};">
                <div>
                  <div style="font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:6px;">

                  <span class="nav-item-left">${icon('brain', 14)} Copilot SDK Dump</span>
                </button>
                <button class="nav-item ${state.nav === 'mcp' ? 'active' : ''}" onclick="setNav('mcp')">
                  <span class="nav-item-left">${icon('terminal', 14)} External MCP Push</span>
                  <span class="nav-count">${mcpCount}</span>
                </button>
                <button class="nav-item ${state.nav === 'pool' ? 'active' : ''}" onclick="setNav('pool')">

    // Variant B: Single-Card Zen Focus Deck (Zero lists, one card at a time)
    let zenDeckIndex = 0;
    function renderMacOSVariantB() {
      const deck = [
        { slot: `${icon('flame', 13)} Life · Quick Slot (~5m)`, key: 'quick', task: state.tasks.find(t => t.id === state.weeklyDraw.quickId) },
        { slot: `${icon('wrench', 13)} Life · Medium Slot (~20m)`, key: 'medium', task: state.tasks.find(t => t.id === state.weeklyDraw.mediumId) },
        ...DrawEngine.computeWorkDraw(state).visible.map(t => ({
          slot: `${icon('monitor', 13)} Computer / Work Pool`,
          key: 'work',
          task: t
        }))
      ].filter(x => x.task);

      if (zenDeckIndex >= deck.length) zenDeckIndex = 0;
      const current = deck[zenDeckIndex];

      return `
        <div class="macos-shell">
          ${renderMacMenuBar()}
          <div class="macos-window variant-b-window">
            <section class="macos-content" style="align-items:center; justify-content:center; text-align:center; padding:36px;">
              ${renderActiveTimerBanner()}

                ${renderWeekDots()}
              </div>

              <div style="width:100%; max-width:540px; text-align:left; margin:12px 0;">
                ${current ? (state.homeLayout === 'list'
                  ? renderTaskListRow(current.task, `${current.slot} · ${zenDeckIndex + 1}/${deck.length}`, current.key)
                  : renderTaskCard(current.task, `${current.slot} · ${zenDeckIndex + 1}/${deck.length}`, current.key)

                <button class="btn" onclick="stepZenDeck(-1)">&larr; Previous</button>

              </div>
            </section>
          </div>
        </div>
      `;
    }

    function stepZenDeck(delta) {
      zenDeckIndex = Math.max(0, zenDeckIndex + delta);
      renderAll();
    }

        task: t,
        label: `${icon('monitor', 13)} Computer / Work`,

      return `

              ${renderActiveTimerBanner()}

                  <button class="btn btn-sm ${state.nav === 'pool' ? 'btn-primary' : ''}" onclick="setNav('pool')">Pools</button>
                </div>
                ${renderWeekDots()}
              </div>

              ${state.nav !== 'home' ? renderMainContentView() : `
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:18px;">
                  <div style="display:flex; flex-direction:column; gap:10px;">
                    <div class="section-title">${icon('home', 13)} 1. Life Draw (Outside, Errands, Anywhere)</div>
                    ${renderDrawnItems(lifeItems)}
                  </div>
                  <div style="display:flex; flex-direction:column; gap:10px;">
                    <div style="display:flex; align-items:center; justify-content:space-between;">
                      <span class="section-title">${icon('monitor', 13)} 2. Computer / Work Pool</span>
                      <button class="btn btn-sm" onclick="toggleWorkDuty()">${state.workHoursOn ? 'Off Duty' : 'On Duty'}</button>
                    </div>
                    ${state.workHoursOn ? renderDrawnItems(workItems) : `<div class="task-card"><div class="task-notes">Off duty - Computer pool hidden.</div></div>`}
                  </div>
                </div>
              `}
            </section>
          </div>
        </div>
      `;
    }
